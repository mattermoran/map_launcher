name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dart-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --platform chrome test/platform/web_test.dart
      - run: flutter test
        working-directory: example
      - run: flutter build web
        working-directory: example

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter test test/platform/desktop_test.dart

  android:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.41.9'
            agp: '8.12.1'
            kotlin: '2.2.0'
            gradle: '8.13'
          - flutter: '3.47.6'
            agp: '9.1.0'
            kotlin: '2.4.0'
            gradle: '9.3.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Build a consumer with the supported Android toolchain
        env:
          AGP: ${{ matrix.agp }}
          KOTLIN: ${{ matrix.kotlin }}
          GRADLE: ${{ matrix.gradle }}
        run: |
          flutter create --platforms=android --empty --project-name map_launcher_compat "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          flutter pub add "map_launcher:{path: $GITHUB_WORKSPACE}"
          sed -i -E "s/(id\(\"com.android.application\"\) version )\"[^\"]+\"/\1\"$AGP\"/" android/settings.gradle.kts
          sed -i -E "s/(id\(\"org.jetbrains.kotlin.android\"\) version )\"[^\"]+\"/\1\"$KOTLIN\"/" android/settings.gradle.kts
          sed -i -E "s/gradle-[0-9.]+-all.zip/gradle-$GRADLE-all.zip/" android/gradle/wrapper/gradle-wrapper.properties
          flutter build apk --release
